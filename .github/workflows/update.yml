name: Update data and deploy

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore MiniHeadQuarters detail cache
        uses: actions/cache@v4
        with:
          path: cache/mhq
          key: mhq-${{ github.run_id }}
          restore-keys: mhq-

      - name: Scrape both sources
        if: github.event_name != 'push'
        run: |
          python scrape_bcp.py
          python scrape_mhq.py

      - name: Build merged dataset
        run: python build.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bcp.json data/mhq.json data/events.json site/events.js
          git commit -m "data: refresh $(date -u +%F)" || echo "nothing to commit"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
